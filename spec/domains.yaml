# Domain graph for the Civitas benchmark app.
#
# Both topologies are generated from this file by `generator/`.
# - tree:     each domain is one module. A domain imports the modules of the domains it depends on.
# - api-impl: each domain is split into <Name>API and <Name>. A domain imports only the API modules
#             of the domains it depends on. API modules import only `apiCore`.
#
# Domain edges must form a DAG so the tree topology can express them.

app: Civitas
bundleIdPrefix: io.github.karthikbedre.civitas
deploymentTarget: "17.0"
swiftVersion: "6.0"

core:
  - name: CoreKit
    dependsOn: []
  - name: CoreModels
    dependsOn: [CoreKit]
  - name: DesignSystem
    dependsOn: [CoreKit, CoreModels]
  - name: DI
    dependsOn: []

# Core modules the app target depends on.
appCore: [DesignSystem, DI]

# Core modules every API module depends on (api-impl only).
apiCore: [CoreKit, CoreModels]

# Core modules every domain implementation depends on.
domainCore: [CoreKit, CoreModels, DesignSystem, DI]

domains:
  # Foundation
  - name: Identity
    dependsOn: []
  - name: Places
    dependsOn: []
  - name: Notifications
    dependsOn: [Identity]
  - name: Favorites
    dependsOn: [Identity]
  - name: Agenda
    dependsOn: [Identity, Notifications]
  - name: Wallet
    dependsOn: [Identity, Notifications]

  # Commerce
  - name: Tickets
    dependsOn: [Wallet, Identity, Notifications, Agenda]
  - name: Reservations
    dependsOn: [Identity, Notifications, Agenda]

  # Features
  - name: Events
    dependsOn: [Tickets, Places, Favorites, Agenda]
  - name: Dining
    dependsOn: [Reservations, Places, Favorites]
  - name: Parking
    dependsOn: [Identity, Wallet, Places, Notifications]
  - name: Transit
    dependsOn: [Identity, Wallet, Places, Favorites]
  - name: Library
    dependsOn: [Identity, Notifications, Agenda, Favorites, Places]
  - name: ReportIssue
    dependsOn: [Identity, Places, Notifications]

  # Aggregators
  - name: Search
    dependsOn: [Events, Dining, Library, Transit, Places]
  - name: Home
    dependsOn: [Identity, Notifications, Agenda, Favorites, Wallet, Tickets, Reservations, Events, Dining, Parking, Transit, Library, ReportIssue, Search]

# Growth beyond the seeds, used by `civitas-gen --domains N`. Synthetic domains are expanded from
# sources/Templates/SyntheticDomain and attach to earlier domains with preferential attachment,
# so a few domains become hubs, as in large production apps. Same seed, same graph.
synthetic:
  seed: 20261004
  identityProbability: 0.7
  minDependencies: 1
  maxDependencies: 4
  hubBias: 1.0
  excluded: [Home, Search]
  prefixes: [Street, Park, Water, Energy, Youth, Senior, Business, Housing, Health, Animal, Arts, Sports, Tourism, Safety, Waste, Tree, Harbor, School, Bike, Noise]
  suffixes: [Permits, Programs, Requests, Grants, Registry, Bookings, Inspections, Alerts, Licenses, Feedback]
